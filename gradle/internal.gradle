// gradle/internal.gradle

tasks.register('modPathListener') {
    description = 'Listens for mod path broadcasts.'
    group = 'development'

    doLast {
        def port = 56656
        def running = true

        println "Listening on ${port}."

        def serverSocket = new ServerSocket(port)
        serverSocket.setSoTimeout(1000)

        while (running) {
            try {
                def socket = serverSocket.accept()
                def reader = new BufferedReader(new InputStreamReader(socket.inputStream))
                def input = reader.readLine()

                if (input) {
                    def propsFile = file('dynamic-mods.properties')
                    def sanitizedInput = input.replace('\\', '/')
                    propsFile.text = "modsPath=${sanitizedInput}"
                    println "Received mod path: ${sanitizedInput}"
                    socket.outputStream.write(0)
                    running = false
                }
                socket.close()
            } catch (SocketTimeoutException ignored) {
            }
        }
        serverSocket.close()
    }
}

tasks.register('refreshDynamicMods') {
    group = 'development'
    doLast {
        project.configurations.configureEach {
            it.resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
            it.resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
        }
    }
    doFirst {
        def propsFile = file('dynamic-mods.properties')
        if (!propsFile.exists()) {
            println "No dynamic-mods.properties found!"
            return
        }
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        println "Loaded mods from: ${props.getProperty('modsPath')}"
    }
}

tasks.register('showModsPath') {
    group = 'help'
    doLast {
        def propsFile = file('dynamic-mods.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            println "Current path: ${props.getProperty('modsPath')}"
        } else {
            println "No configuration found."
        }
    }
}

tasks.register('clearModsPath') {
    group = 'development'
    doLast {
        if (file('dynamic-mods.properties').delete()) println "Configuration cleared."
    }
}

tasks.register('buildBundle') {
    group = 'build'
    description = 'Bundle equivalent to jar'

    doLast {
        def propsFile = file('gradle.properties')
        if (!propsFile.exists()) {
            throw new GradleException("gradle.properties not found!")
        }
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }

        def bundleId = props.getProperty('bundleId')
        def version = props.getProperty('version')

        if (!bundleId || !version) {
            throw new GradleException("bundleId and version must be defined in gradle.properties")
        }

        def targetDir = file("build/bundles/${bundleId}-${version}")

        if (targetDir.exists()) targetDir.deleteDir()
        targetDir.mkdirs()

        copy {
            from 'src/main/groovy'
            into "${targetDir}"
        }

        copy {
            from 'src/main/resources'
            into targetDir
        }

        println "Bundle created at: ${targetDir.absolutePath}"
    }
}