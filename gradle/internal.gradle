// gradle/internal.gradle

tasks.register('modPathDaemon') {
    description = 'Listens for mod path broadcasts. Type q + Enter to stop.'
    group = 'development'

    doLast {
        def port = 25566
        def running = true

        println "\n[Daemon] Listening on ${port}. Type 'q' + Enter to stop."

        Thread.start {
            def reader = new BufferedReader(new InputStreamReader(System.in))
            while (running) {
                try {
                    if (reader.ready()) {
                        def input = reader.readLine()?.trim()
                        if (input == 'q') {
                            println "[Daemon] Shutting down."
                            running = false
                        }
                    }
                    sleep(100)
                } catch (Exception ignored) {}
            }
        }

        def serverSocket = new ServerSocket(port)
        serverSocket.setSoTimeout(1000)

        while (running) {
            try {
                def socket = serverSocket.accept()
                def reader = new BufferedReader(new InputStreamReader(socket.inputStream))
                def input = reader.readLine()

                if (input) {
                    def propsFile = file('dynamic-mods.properties')
                    propsFile.text = "modsPath=${input.replace('\\', '/')}"
                    socket.outputStream.write(0)
                }
                socket.close()
            } catch (SocketTimeoutException ignored) {
            }
        }
        serverSocket.close()
    }
}

tasks.register('refreshDynamicMods') {
    group = 'development'
    doLast {
        def propsFile = file('dynamic-mods.properties')
        if (!propsFile.exists()) {
            println "No dynamic-mods.properties found!"
            return
        }
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        println "Loaded mods from: ${props.getProperty('modsPath')}"
    }
}

tasks.register('showModsPath') {
    group = 'help'
    doLast {
        def propsFile = file('dynamic-mods.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            println "Current path: ${props.getProperty('modsPath')}"
        } else {
            println "No configuration found."
        }
    }
}

tasks.register('clearModsPath') {
    group = 'development'
    doLast {
        if (file('dynamic-mods.properties').delete()) println "Configuration cleared."
    }
}