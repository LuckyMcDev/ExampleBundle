plugins {
    id 'groovy'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

// Apply the internal helper tasks
apply from: 'gradle/internal.gradle'

group = 'UNDEFINED'
version = project.version

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.0.0-alpha.15+pre-3'
    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.ansi', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

tasks.named('runClient') {
    dependsOn tasks.named('deployBundle')
}

dependencies {
    implementation "org.apache.groovy:groovy:5.0.4"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def propsFile = file('dynamic-mods.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def modsPath = props.getProperty('modsPath')
        if (modsPath) {
            def modsDir = file(modsPath)
            if (modsDir.exists() && modsDir.isDirectory()) {
                fileTree(modsDir).include('**/*.jar').each { jarFile ->
                    dependencies.add("implementation", files(jarFile))
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}